# ThreatLens Hugging Face Spaces Nginx Configuration
# Listens on Port 7860 (Hugging Face default exposed port)

server {
    listen 7860;
    server_name localhost;

    # Client body size limit for PCAP uploads / REST payloads
    client_max_body_size 100M;

    # Serve compiled React SOC Dashboard static assets
    location / {
        root /app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets efficiently
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }

    # Proxy REST API endpoints to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Proxy WebSocket telemetry & live threat alert feed
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep WebSockets alive without timeout drops
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
