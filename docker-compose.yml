version: '3.8'

services:
  # ============================================================================
  # Redpanda - High-performance, zero-JVM Kafka alternative
  # ============================================================================
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: threatlens-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "9644:9644" # Redpanda Admin API
    volumes:
      - ./data/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9644/v1/status/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - threatlens-net

  # ============================================================================
  # Redpanda Console - Real-time topic, consumer group & message inspector
  # ============================================================================
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: threatlens-redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - threatlens-net

  # ============================================================================
  # Redis - Multi-tier in-memory sliding window feature store (10s, 60s, 300s)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: threatlens-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - threatlens-net

  # ============================================================================
  # ClickHouse - High-density columnar OLAP historical alert & flow storage
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: threatlens-clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native TCP client
    environment:
      CLICKHOUSE_DB: threatlens
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  # ============================================================================
  # Zeek - High-speed passive network analysis & JSON metadata generator
  # ============================================================================
  zeek:
    build:
      context: ./ingest/zeek
      dockerfile: Dockerfile
    container_name: threatlens-zeek
    environment:
      MODE: watch
      LOG_DIR: /logs
      PCAP_DIR: /pcaps
    volumes:
      - ./pcaps:/pcaps:ro
      - ./logs:/logs
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - threatlens-net

networks:
  threatlens-net:
    name: threatlens-net
    driver: bridge
